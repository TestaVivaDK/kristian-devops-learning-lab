apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-web
  namespace: kristian-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: learning-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learning-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: kristian-web:1.0.0
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
