rbac:
  create: false
  namespaced: true

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana-kristian.testaviva.dev
  tls:
    - secretName: grafana-kristian-tls
      hosts:
        - grafana-kristian.testaviva.dev