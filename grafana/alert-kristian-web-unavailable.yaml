apiVersion: 1
groups:
    - orgId: 1
      name: kristianEvaluation
      folder: myAlerts
      interval: 1m
      rules:
        - uid: ffx81c8yrlxj4c
          title: Replica Unavailable
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: dfx7ud8vwbfnke
              model:
                editorMode: code
                expr: kube_deployment_status_replicas_unavailable{namespace="kristian-lab", deployment="kristian-web"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: kristian-devops
